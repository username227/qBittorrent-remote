name: Windows UCRT64 installer and CTest

on:
  pull_request:
    branches:
      - master
      - 'feature/**'
  # Seed a default-branch compiler cache accessible to subsequent PRs.
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qtkeychain
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-nsis

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: windows-ucrt64-ccache-v1-${{ github.sha }}
          restore-keys: |
            windows-ucrt64-ccache-v1-

      - name: Build, CTest, stage and package installer
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
          CCACHE_COMPILERCHECK: content
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ccache --zero-stats
          bash packaging/windows/build-installer.sh

      - name: Compiler cache statistics
        if: always()
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: ccache --show-stats

      - name: Exercise real installer scopes and upgrades
        timeout-minutes: 6
        shell: pwsh
        run: |
          $installer = Get-ChildItem build/windows-ucrt/dist/*.exe
          if (@($installer).Count -ne 1) { throw 'Expected one installer EXE' }
          & packaging/windows/test-installer.ps1 -Installer $installer.FullName

      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: qBittorrent-Remote-Windows-x64-Setup
          path: build/windows-ucrt/dist/*.exe
          if-no-files-found: error
