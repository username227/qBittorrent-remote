name: Linux Arch CMake and CTest

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master
      - 'feature/**'

permissions:
  contents: read

jobs:
  arch-build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 25
    steps:
      - name: Install Arch development dependencies
        run: |
          pacman -Syu --noconfirm --needed git cmake ninja gcc pkgconf qt6-base qt6-svg openssl
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure and compile native Linux app
        run: |
          cmake --preset dev
          cmake --build --preset dev
      - name: Exercise functional Qt workflows through CTest
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset dev --output-on-failure
      - name: Diagnose Manage Content crash (temporary, remove after fix)
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pacman -S --noconfirm --needed gdb
          gdb --quiet --batch -ex 'set pagination off' -ex run -ex 'thread apply all bt 35' --args ./build/dev/test_connection_workflow nativeManageContentAndTorrentOptionsChangeServerState
